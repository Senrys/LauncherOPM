# ---------------------------------------------------------------------------
# Alembic — migrations du serveur d'authentification One Piece Minecraft.
#
# ATTENTION : ces migrations s'appliquent sur la base PARTAGÉE du site Flask.
# Elles sont strictement ADDITIVES : elles ne créent que les tables du launcher
# (préfixes auth_, ygg_, launcher_, plus texture / user_texture) et ne touchent
# jamais aux 11 tables du site (users, article, statistiques, equipages, iles,
# combats, produits, equipe, securite, contact, alembic_version).
#
# Lisez migrations/README.md AVANT toute application en production.
# ---------------------------------------------------------------------------

[alembic]
# Emplacement des scripts, relatif à ce fichier.
script_location = migrations

# Permet à « alembic » lancé depuis auth-server/ d'importer le paquet opm_auth.
prepend_sys_path = .

# Nom des fichiers de révision : <revision>_<slug>.py (ex. 0001_launcher_auth.py).
file_template = %%(rev)s_%%(slug)s

# Les horodatages générés (en-têtes de révision) sont en UTC.
timezone = UTC

# Séparateur de la liste version_locations : dépend du système d'exploitation.
version_path_separator = os

# Encodage des fichiers de migration produits par « alembic revision ».
output_encoding = utf-8

# ---------------------------------------------------------------------------
# PAS de clé « sqlalchemy.url » ici : c'est volontaire.
#
# L'URL de connexion vient exclusivement de la configuration applicative
# (opm_auth.config.Settings.sqlalchemy_url, alimentée par OPM_DATABASE_URL ou
# le fichier .env). migrations/env.py la lit lui-même. Aucun secret ne doit
# apparaître dans un fichier versionné.
#
# Pour viser ponctuellement une autre base sans modifier .env :
#     OPM_DATABASE_URL=postgresql://user:mdp@hote/opmdb alembic upgrade head
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
