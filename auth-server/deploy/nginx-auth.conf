# auth.onepieceminecraft.fr — façade nginx du serveur d'authentification.
#
# Installation :
#   sudo cp /opt/opm-auth/auth-server/deploy/nginx-auth.conf \
#           /etc/nginx/sites-available/auth.onepieceminecraft.fr
#   sudo ln -s /etc/nginx/sites-available/auth.onepieceminecraft.fr \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis le certificat :
#   sudo certbot --nginx -d auth.onepieceminecraft.fr
#
# certbot ajoute lui-même le bloc 443, les directives ssl_* et la redirection
# depuis le port 80. Ce fichier est donc volontairement en HTTP seul : c'est
# l'état dans lequel certbot doit le trouver.

server {
    listen 80;
    listen [::]:80;
    server_name auth.onepieceminecraft.fr;

    # Les skins et capes peuvent peser jusqu'à OPM_TEXTURE_MAX_KIB ; 2 Mio
    # laissent de la marge sans ouvrir la porte aux téléversements abusifs.
    client_max_body_size 2m;

    access_log /var/log/nginx/opm-auth.access.log;
    error_log  /var/log/nginx/opm-auth.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # X-Forwarded-For : nginx AJOUTE l'IP réelle à la fin de la chaîne, et
        # le serveur la lit par la droite en sautant OPM_TRUSTED_PROXIES entrées
        # (1 = nginx seul). Sans ces en-têtes, toutes les requêtes porteraient
        # l'IP 127.0.0.1 et la limitation de débit bloquerait tout le monde
        # d'un coup.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La notarisation Microsoft et le téléversement de textures peuvent être
        # lents ; 60 s évitent une coupure au milieu d'un rattachement.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
