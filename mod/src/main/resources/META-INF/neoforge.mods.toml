modLoader = "javafml"
loaderVersion = "[4,)"
license = "Tous droits réservés"
issueTrackerURL = "https://github.com/Senrys/LauncherOPM/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "One Piece Minecraft"
description = '''
Le mod du modpack One Piece Minecraft : l'écran de chargement de Xenodys, son envol
et l'écran titre assorti au launcher. Côté client uniquement.
'''

[[mixins]]
config = "opm.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"
