# Fichiers du modpack — à coller DANS le bloc « server » de
# onepieceminecraft.fr (pas dans celui de auth.onepieceminecraft.fr).
#
#   sudo nano /etc/nginx/sites-available/onepieceminecraft.fr
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le dossier /var/www/opm-launcher/ est celui où vous déposez vos mods.
# Sa structure EST celle de l'instance chez le joueur :
#
#   /var/www/opm-launcher/
#   ├── files.json      ← généré tout seul, ne le modifiez jamais à la main
#   ├── mods/
#   ├── config/
#   └── servers.dat

location /launcher/ {
    alias /var/www/opm-launcher/;

    # Aucun listing : le launcher lit files.json, personne n'a à parcourir
    # l'arborescence, et un index ouvert révèle la composition du modpack.
    autoindex off;

    # Les .jar et les .zip ne sont pas tous dans mime.types selon les versions ;
    # sans ce repli, nginx peut refuser de servir une extension inconnue.
    default_type application/octet-stream;

    # Les fichiers du modpack sont immuables à empreinte donnée : un mod qui
    # change change aussi de contenu, donc de SHA-1, et le launcher le
    # retéléchargera de toute façon. Un cache long est donc sans risque.
    add_header Cache-Control "public, max-age=86400";
}

# Le manifeste, LUI, change à chaque mise à jour du modpack. S'il était mis en
# cache, les joueurs continueraient de lire l'ancienne liste pendant des heures
# et ne verraient jamais la mise à jour.
location = /launcher/files.json {
    alias /var/www/opm-launcher/files.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}
