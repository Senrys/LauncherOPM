# Fichiers du modpack, servis par auth.onepieceminecraft.fr/launcher/.
#
# Ce fichier est un SNIPPET : il ne contient que des blocs « location », pas de
# bloc « server ». Il s'inclut depuis le vhost de auth.onepieceminecraft.fr.
#
# Installation :
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp /opt/opm-auth/auth-server/deploy/nginx-launcher-files.conf \
#           /etc/nginx/snippets/opm-launcher-files.conf
#
# Puis UNE seule ligne à ajouter dans le bloc « server » qui écoute en 443
# (celui que certbot a créé), à côté du « location / » existant :
#
#   include snippets/opm-launcher-files.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# On n'écrase surtout pas le vhost déployé : certbot y a écrit le bloc 443, les
# directives ssl_* et la redirection depuis le port 80.
#
# Ordre de résolution : nginx choisit le préfixe le PLUS LONG, donc « /launcher/ »
# l'emporte sur le « location / » qui relaie vers le serveur d'authentification,
# et « = /launcher/files.json » l'emporte sur les deux. Aucun conflit possible
# avec les routes de l'API (/api/v1/, /yggdrasil/, /textures/).
#
# Le dossier /var/www/opm-launcher/ EST la racine de l'instance :
#
#   /var/www/opm-launcher/
#   ├── files.json      ← généré tout seul, ne le modifiez jamais à la main
#   ├── mods/
#   ├── config/
#   └── servers.dat

location /launcher/ {
    alias /var/www/opm-launcher/;

    # Aucun listing : le launcher lit files.json, personne n'a à parcourir
    # l'arborescence, et un index ouvert révèle la composition du modpack.
    autoindex off;

    # Les .jar ne sont pas dans mime.types de toutes les versions de nginx ;
    # sans ce repli, une extension inconnue peut être refusée.
    default_type application/octet-stream;

    # Un fichier du modpack est immuable à empreinte donnée : s'il change, son
    # SHA-1 change, le manifeste change, et le launcher le retélécharge. Un
    # cache long est donc sans risque et épargne votre bande passante.
    add_header Cache-Control "public, max-age=86400";
}

# Le manifeste, LUI, change à chaque mise à jour du modpack. Mis en cache, les
# joueurs liraient l'ancienne liste pendant des heures sans voir la mise à jour.
location = /launcher/files.json {
    alias /var/www/opm-launcher/files.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}
